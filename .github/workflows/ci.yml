name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Especificación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar
        run: npm install

      - name: Build + las 20 comprobaciones de ICON_SPEC.md §11
        run: npm test

      # El build es determinista: si los artefactos generados no coinciden con
      # las fuentes, alguien edito un archivo generado a mano.
      - name: Artefactos sincronizados con la fuente
        run: |
          if ! git diff --exit-code; then
            echo "::error::Hay artefactos desincronizados. Ejecuta 'npm run build' y vuelve a commitear."
            exit 1
          fi

  pages:
    name: Publicar el sitio
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
